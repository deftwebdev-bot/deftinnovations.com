<!DOCTYPE html>
<html>

<title>Video Frames</title>
<style>
body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; margin: 0; }
h1 { font-size: 14px; color: #888; margin-bottom: 20px; }
.frames { display: flex; gap: 8px; flex-wrap: wrap; }
.frame { flex: 0 0 auto; }
.frame img { max-width: 400px; height: auto; border: 1px solid #333; border-radius: 4px; }
.frame p { font-size: 10px; color: #666; margin: 4px 0 0; }
</style>
</head>
<body>
<h1>Reference Video Frames (9s)</h1>

</html>
